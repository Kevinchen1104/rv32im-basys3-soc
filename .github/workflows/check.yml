name: Check

on:
  push:
  pull_request:

jobs:
  project-check:
    name: Project check
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        shell: pwsh
        run: choco install iverilog --yes --no-progress

      - name: Verify toolchain
        shell: pwsh
        run: |
          iverilog -V
          vvp -V

      - name: Run project check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\check.ps1

      - name: Upload check summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-summaries
          path: |
            wave/regression-summary.json
            wave/regression-evidence-summary.json
            wave/check-summary.json
            wave/test-catalog-summary.json
          if-no-files-found: ignore
