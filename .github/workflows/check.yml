name: Check

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: Python clients and tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r scripts/signal-viewer-requirements.txt -r tools/compiled-programs/requirements.txt
      - name: Run Python tests including Tk controls
        run: python -B scripts/python_tests.py --gui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-tests
          path: results/python-tests/

  project-check:
    name: Project check
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        shell: pwsh
        run: choco install iverilog --yes --no-progress

      - name: Verify toolchain
        shell: pwsh
        run: |
          iverilog -V
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          vvp -V
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run project check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\check.ps1 -Mode Full

      - name: Upload check summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-summaries
          path: |
            results/regression-summary.json
            results/regression-evidence-summary.json
            results/check-summary.json
            results/test-catalog-summary.json
            results/logs/
            results/runner-self-test-summary.json
            results/workflow-self-test-summary.json
            results/RESULTS.md
            results/regression.csv
          if-no-files-found: ignore
