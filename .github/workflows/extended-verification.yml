name: Extended Verification

on:
  workflow_dispatch:

jobs:
  windows-release-smoke:
    name: Windows release smoke
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        shell: pwsh
        run: choco install iverilog --yes --no-progress

      - name: Install MSYS2 RISC-V and synthesis helpers
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            python
            mingw-w64-ucrt-x86_64-riscv64-unknown-elf-gcc
            mingw-w64-ucrt-x86_64-yosys

      - name: Add MSYS2 UCRT64 to PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $toolBin = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          $toolBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "RISCV_TOOLCHAIN_BIN=$toolBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RISCV_PREFIX=riscv64-unknown-elf-" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native Python experiment dependencies
        run: python -m pip install -r scripts/signal-viewer-requirements.txt -r tools/compiled-programs/requirements.txt

      - name: Project doctor
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\project-doctor.ps1

      - name: Portable full check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\check.ps1

      - name: Showcase summaries
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\showcase-demo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File scripts\interactive-showcase-demo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compiled C and FIR UART simulation
        shell: pwsh
        run: |
          python -B scripts/compiled_programs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/signal_console_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Selected arch-test integration
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\arch-test-detect.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File scripts\arch-test-setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File scripts\arch-test-run.ps1 -Profile rv32im-selected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File scripts\arch-test-report.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: FPGA and portable release smoke
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\synth-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File scripts\fpga-tool-detect.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File scripts\fpga-release.ps1 -BoardProfile generic_uart_boot_runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-verification-evidence
          path: |
            results/*.json
            results/logs/
            results/demo-smoke/*.log
            results/compiled-programs/
            results/signal-console/
            release/configuration/generic_uart_boot_runtime/package.json
          if-no-files-found: ignore
