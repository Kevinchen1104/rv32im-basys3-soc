name: Evidence integrity

on:
  push:
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
      - "firmware/**"
      - "fixtures/**"
      - "formal/**"
      - "fpga/**"
      - "release/**"
      - "rtl/**"
      - "scripts/**"
      - "tb/**"
      - "tools/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
      - "firmware/**"
      - "fixtures/**"
      - "formal/**"
      - "fpga/**"
      - "release/**"
      - "rtl/**"
      - "scripts/**"
      - "tb/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-audit:
    name: Recorded evidence integrity
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Freshness is reported separately. Current source is exercised by check.yml.
      - name: Verify package hashes and recorded provenance
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\final-audit.ps1 -PackagedEvidence

      - name: Upload integrity and freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-integrity
          path: results/final-audit-summary.json
